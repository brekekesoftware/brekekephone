org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

FLIPPER_VERSION=0.182.0
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
newArchEnabled=true
newArchEnabledDebug=true
newArchEnabledRelease=true
hermesEnabled=true
# Opt out of built-in kotlin and new DSL behavior that ships with AGP 9 (React Native 0.87 template).
android.builtInKotlin=false
android.newDsl=false

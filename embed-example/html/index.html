<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brekeke Phone Embed - Example HTML</title>

    <style>
      #root,
      #brekeke_phone {
        position: fixed;
        top: 0;
        bottom: 0;
      }
      #root {
        left: 0;
        right: 50%;
        border-right: 1px solid black;
      }
      #brekeke_phone {
        left: 50%;
        right: 0;
        display: flex;
      }

      .app {
        margin: 10px;
      }

      .call-answer {
        color: green;
      }
      .call-hangup {
        color: red;
      }
      .call-answer,
      .call-hangup {
        margin-left: 10px;
      }

      .video-item {
        display: block;
        width: 150px;
        height: 150px;
        object-fit: cover;
        border-radius: 3px;
        overflow: hidden;
        background-color: black;
        margin-bottom: 10px;
      }
    </style>

    <script type="text/javascript">
      window._BrekekePhoneCaptureConsole = true
    </script>
    <script
      type="text/javascript"
      src="./brekeke_phone3.0.0/webphone.js"
    ></script>
  </head>

  <body>
    <div id="brekeke_phone"></div>
    <div id="root"></div>
  </body>

  <script type="text/javascript">
    var brekekePhoneDiv = document.getElementById('brekeke_phone')
    var phone = window.Brekeke.Phone.render(brekekePhoneDiv, {
      autoLogin: true,
      clearExistingAccounts: false,
      accounts: [
        {
          hostname: 'YOUR_PBX_HOSTNAME',
          port: 'YOUR_PBX_PORT',
          tenant: 'TENANT',
          username: 'USERNAME',
          password: 'PASSWORD',
          uc: true,
        },
      ],
    })
    var ctx = phone.getCurrentAccountCtx()
    var version = phone.getCurrentVersion()

    var imports = window._BrekekePhoneEmbedImports
    var { observer } = imports['mobx-react']
    var { useEffect, useRef, useState, createElement: jsx } = imports['react']
    var { createRoot } = imports['react-dom/client']

    // --- Embed MFA demo (left panel only; right panel = webphone untouched) ---
    var mfaStatus = imports.mobx.observable.box('-')
    var mfaLog = imports.mobx.observable.array([])
    phone.on('mfa', function (e) {
      console.log('[embed mfa]', e)
      mfaStatus.set(e.status)
      mfaLog.unshift(
        new Date().toLocaleTimeString() +
          '  ' +
          e.status +
          (e.message ? ' — ' + e.message : ''),
      )
    })

    // Host reuses the webphone's built-in OTP UI (right panel);
    // only needs the `mfa` event to know when to show/hide its container.
    var MfaEvent = observer(function () {
      var status = mfaStatus.get()
      var shouldShow = status === 'required' || status === 'error'
      var [otp, setOtp] = useState('')
      var [apiResult, setApiResult] = useState('')
      var run = function (label, fn) {
        Promise.resolve()
          .then(fn)
          .then(function (r) {
            setApiResult(label + ' -> ' + JSON.stringify(r == null ? null : r))
          })
          .catch(function (err) {
            setApiResult(
              label +
                ' error: ' +
                (err && err.message ? err.message : String(err)),
            )
          })
      }
      return jsx('div', {
        style: { border: '1px solid #999', padding: 10, marginTop: 10 },
        children: [
          jsx('b', { children: 'MFA event' }),
          jsx('div', {
            children: ['event status: ', jsx('b', { children: status })],
          }),
          jsx('div', {
            children: [
              'host action: ',
              jsx('span', {
                style: {
                  padding: '2px 8px',
                  borderRadius: 4,
                  color: 'white',
                  background: shouldShow ? '#2e7d32' : '#757575',
                },
                children: shouldShow
                  ? 'SHOW OTP screen webphone'
                  : 'HIDE OTP screen webphone',
              }),
            ],
          }),
          jsx('div', {
            style: { fontSize: 12, color: '#555', marginTop: 6 },
            children:
              'Built-in OTP modal shows in the right panel; host just toggles its own container on these events.',
          }),
          jsx('div', {
            style: { marginTop: 8 },
            children: [
              jsx('b', { children: 'API controls for this OTP screen' }),
              jsx('div', {
                style: {
                  display: 'flex',
                  gap: 6,
                  margin: '8px 0',
                  flexWrap: 'wrap',
                },
                children: [
                  jsx('input', {
                    placeholder: 'OTP code',
                    value: otp,
                    onChange: e => setOtp(e.target.value),
                    style: { padding: 4 },
                  }),
                  jsx('button', {
                    onClick: () =>
                      run('verifyMfaCode', () => phone.verifyMfaCode(otp)),
                    children: 'Verify',
                  }),
                  jsx('button', {
                    onClick: () =>
                      run('resendMfaCode', () => phone.resendMfaCode()),
                    children: 'Resend',
                  }),
                  jsx('button', {
                    onClick: () => run('cancelMfa', () => phone.cancelMfa()),
                    children: 'Cancel',
                  }),
                  jsx('button', {
                    onClick: () =>
                      run('getMfaState', () => phone.getMfaState()),
                    children: 'getState',
                  }),
                ],
              }),
              apiResult &&
                jsx('div', {
                  style: {
                    fontFamily: 'monospace',
                    fontSize: 12,
                    color: '#1565c0',
                  },
                  children: apiResult,
                }),
            ],
          }),
          jsx('div', {
            style: { marginTop: 8 },
            children: [
              jsx('b', { children: 'events' }),
              jsx('ul', {
                style: {
                  margin: 0,
                  paddingLeft: 18,
                  maxHeight: 140,
                  overflow: 'auto',
                },
                children: mfaLog.map((l, i) =>
                  jsx('li', {
                    key: i,
                    style: { fontFamily: 'monospace', fontSize: 12 },
                    children: l,
                  }),
                ),
              }),
            ],
          }),
        ],
      })
    })

    var App = observer(() =>
      jsx('div', {
        className: 'app',
        children: [
          // version
          jsx('span', {
            children: ['Web Phone - ', version.webphone, ' | '],
          }),
          jsx('span', {
            children: ['JsSIP - ', version.jssip, ' | '],
          }),
          jsx('span', {
            children: [version.bundleIdentifier, ' '],
          }),
          jsx('hr'),

          // connection status
          jsx('span', {
            children: 'Status: ',
          }),
          jsx('span', {
            children: ['PBX - ', ctx.auth.pbxState, ' | '],
          }),
          jsx('span', {
            children: ['SIP - ', ctx.auth.sipState, ' | '],
          }),
          jsx('span', {
            children: ['Calls - ', ctx.call.calls.length, ' | '],
          }),
          jsx('span', {
            children: ['MFA - ', mfaStatus.get(), ' '],
          }),
          jsx('hr'),

          jsx(MfaEvent),

          // display all calls
          ctx.call.calls.map(c => jsx(Call, { call: c })),
        ],
      }),
    )

    var reactRootDiv = document.getElementById('root')
    createRoot(reactRootDiv).render(jsx(App))

    var Call = observer(({ call }) =>
      jsx('div', {
        className: 'call-item',
        children: [
          // call title
          jsx('span', {
            className: 'call-from',
            children: ['Call Display Name: ', call.getDisplayName()],
          }),

          // answer, hangup this call
          call.incoming &&
            !call.answered &&
            jsx('button', {
              className: 'call-answer',
              onClick: () => call.answer(),
              children: 'Answer',
            }),
          jsx('button', {
            className: 'call-hangup',
            onClick: () => call.hangupWithUnhold(),
            children: 'Hangup',
          }),

          // all participants' video in this call
          jsx('div', {
            className: 'call-video-items',
            children: [
              jsx('div', {
                children: [
                  'My camera:',
                  jsx(Video, {
                    stream: call.localStreamObject,
                  }),
                ],
              }),
              call.videoClientSessionTable.map(v =>
                jsx('div', {
                  children: [
                    v.user,
                    "'s camera:",
                    jsx(Video, {
                      stream: v.remoteStreamObject,
                    }),
                  ],
                }),
              ),
            ],
          }),

          jsx('hr'),
        ],
      }),
    )

    var Video = observer(({ stream }) => {
      var r = useRef()
      useEffect(() => {
        if (r.current && stream) {
          r.current.srcObject = stream
        }
      }, [r.current, stream])
      return jsx('video', {
        className: 'video-item',
        ref: r,
        playsInline: true,
        autoPlay: true,
      })
    })
  </script>
</html>
